<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Trips</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">                                                                                    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>My Trips (Trip List)</h1>

        <p class="description">
            List view of all trips created by the user with basic summary data.
        </p>

        <p class="purpose">
            Easily access and manage existing or upcoming trips.
        </p>

        <h2>Key Functionality / Components</h2>

        <div class="trip-container">

            <div class="trip-card">
                <h3>Goa Trip</h3>
                <p><strong>Date:</strong> 10 Aug - 15 Aug</p>
                <p><strong>Destinations:</strong> 3</p>

                <div class="buttons">
                    <button>Edit</button>
                    <button>View</button>
                    <button class="delete">Delete</button>
                    <button><a href="builder.html" style="text-decoration: none; color: white;">Trip Planner</a></button>
                </div>
            </div>

            <div class="trip-card">
                <h3>Paris Trip</h3>
                <p><strong>Date:</strong> 20 Sep - 28 Sep</p>
                <p><strong>Destinations:</strong> 5</p>

                <div class="buttons">
                    <button>Edit</button>
                    <button>View</button>
                    <button class="delete">Delete</button>
                    <button><a href="builder.html" style="text-decoration: none; color: white;">Trip Planner</a></button>
<button><a href="Dashboard.html" style="text-decoration: none; color: white; background-color: red;">Exit</a></button>
               
                </div>
            </div>

        </div>

    </div>

</body>
</html>
