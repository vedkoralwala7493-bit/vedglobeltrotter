<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Planner</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">                                                                                    
    <link rel="stylesheet" href="style.css">
<style>
        body{
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f5f5f5;
        }
        .container{
            width: 350px;
            padding: 30px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body>

    <div class="container">

        <h1>Trip Planner</h1>

        <p class="description">
            Interface to add cities, dates, and activities for each stop.
        </p>

        <p class="purpose">
            Construct the full day-wise trip plan in an interactive format.
        </p>

        <h2>Trip Itinerary</h2>

        <button class="add-stop">+ Add Stop</button>

        <div class="stop-card">

            <div class="stop-header">
                <br>
                <br>
                <h3>Stop 1</h3>
                <br>
                <button class="move">↕ Reorder</button>
            </div>
            <br>
            <br>
            <label>City</label>
            <select>
                <option>Select City</option>
                <option>Paris</option>
                <option>London</option>
                <option>Dubai</option>
                <option>Tokyo</option>
            </select>

            <div class="date-box">
                <div>
                    <label>Start Date</label>
                    <input type="date">
                </div>

                <div>
                    <label>End Date</label>
                    <input type="date">
                </div>
            </div>

            <label>Activities</label>
            <input type="text" placeholder="Enter activities">

            <button class="save">Save Stop</button>

        </div>


        <div class="stop-card">

            <div class="stop-header">
                <br>
                <br>
                <h3>Stop 2</h3>
                <br>
                <button class="move">↕ Reorder</button>
                <br>
                <br>
            </div>

            <label>City</label>
            <select>
                <option>Select City</option>
                <option>Paris</option>
                <option>London</option>
                <option>Dubai</option>
                <option>Tokyo</option>
            </select>

            <div class="date-box">
                <div>
                    <label>Start Date</label>
                    <input type="date">
                </div>

                <div>
                    <label>End Date</label>
                    <input type="date">
                </div>
            </div>

            <label>Activities</label>
            <input type="text" placeholder="Enter activities">

            <button class="save">Save Stop</button>

        </div>

    <div class="add">
        <br>
        <br>
        <button><a href="list.html" style="text-decoration: none; color: white;"> + Add another section</a></button>
<button><a href="Dashboard.html" style="text-decoration: none; color: white; background-color: red;">Exit</a></button>
    
    </div>
    </div>

</body>
</html>
