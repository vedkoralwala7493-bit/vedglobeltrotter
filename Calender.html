    <style>
        body {
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.calendar {
    background: white;
    width: 450px;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
}

.calendar h2 {
    text-align: center;
    margin-bottom: 20px;
}

.days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    text-align: center;
}

.days div {
    font-weight: bold;
    padding: 10px 0;
    color: #555;
}

.days span {
    padding: 12px 0;
    border-radius: 6px;
    cursor: pointer;
}

.days span:hover {
    background: #3399ff;
    color: white;
}
    </style>
</head>
