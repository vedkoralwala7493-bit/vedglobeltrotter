<!DOCTYPE html>
<html>
<head>
    <title>Trip Idea</title>
    <style>
        * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.trip-card {
    width: 450px;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.12);
}

.trip-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.trip-header h2 {
    color: #222;
    margin-bottom: 5px;
}

.trip-header p {
    color: #777;
}

.public-icon {
    background: #e8f5e9;
    color: #2e7d32;
    padding: 7px 12px;
    border-radius: 20px;
    font-size: 14px;
}

.description {
    margin: 20px 0;
    line-height: 1.6;
    color: #555;
}

.trip-info {
    display: flex;
    justify-content: space-between;
    background: #f7f9fc;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 20px;
}

.buttons {
    display: flex;
    gap: 10px;
}

button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
}

.copy-btn {
    background: #0059b3;
    color: white;
}

.share-btn {
    background: #e9eef5;
    color: #333;
}

button:hover {
    opacity: 0.85;
}

#message {
    text-align: center;
    color: #2e7d32;
    margin-top: 12px;
    font-size: 14px;
}
    </style>
</head>
<body>

<div class="trip-card">

    <div class="trip-header">
        <div>
            <h2>Paris Adventure</h2>
            <p>5 Days • France</p>
        </div>

        <!-- Public icon -->
        <span class="public-icon">🌐 Public</span>
    </div>

    <p class="description">
        Explore the Eiffel Tower, Louvre Museum, and beautiful streets of Paris.
    </p>

    <div class="trip-info">
        <span>📅 10 Aug - 14 Aug</span>
        <span>💰 $800</span>
    </div>

    <div class="buttons">
        <button class="copy-btn" onclick="copyTrip()">
            📋 Copy Trip
        </button>

        <button class="share-btn">
            🔗 Share
        </button>
<button><a href="Profile.html" style="text-decoration: none; color: black:">Your Profile</a></button>

    </div>

    <p id="message"></p>

</div>

<script>
function copyTrip() {
    const trip = "Paris Adventure - 5 Days - France - Budget: $800";

    navigator.clipboard.writeText(trip);

    document.getElementById("message").innerText =
        "Trip idea copied!";
}
</script>
</body>
</html>
